<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOAN CALCULATOR</title>
    <link rel="stylesheet" href="./loan.css">
</head>
<body>
    <div class="container">
        <h1>LOAN CALCULATOR</h1>

        <label for="loan">Loan Amount:</label>
        <input type="number" id="loan" placeholder="Enter Loan Amount">

        <label for="Interest">Interest Rate(%):</label>
        <input type="number" id="interest" placeholder="Enter Interest Rate">

        <label for="loan-term">Loan Term (In Months)</label>
        <input type="number" id="month" placeholder="Enter Loan Term">

        <button id="btn">
            Calculate
        </button>
    </div>

    <div class="finalres">
        Final Result
    </div>

    <script src="./loan.js"></script>
</body>
</html>
